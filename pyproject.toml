[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nwchemex-friendzone"
description = "Provides SimDE compatible APIs so that NWChemEx can play nicely with its friends."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "zachcran",    email = "zachcran@iastate.edu" },
    { name = "jwaldrop107", email = "jwaldrop@ameslab.gov" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = ["nwchemex-simde>=0.0.77"]

[project.optional-dependencies]
ase    = ["ase"]
molssi = ["qcengine", "qcelemental", "networkx"]
test   = ["pytest", "numpy"]
dev    = ["nwchemex-friendzone[test]", "tox", "pre-commit"]

# Python source lives under python/ (analogous to cxx/ in C++ repos).
[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = [
    "error",
    "ignore::pytest.PytestCacheWarning",
    # ase's own Atoms.new_array (ase/atoms.py) still does `a.shape = (-1,)
    # + shape` on an empty array, which numpy >=2.5 deprecates in favor of
    # np.reshape. Unrelated to anything NWChemEx-side; ase's own bug, not
    # ours to fix -- ignore rather than let it hard-fail every ASE-backed
    # friend test.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ase\\..*",
]
testpaths = ["tests"]
