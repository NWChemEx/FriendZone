name: Pull Request Workflow

on:
  pull_request:
    branches:
      - build_overhaul

jobs:
  check_formatting:
    uses: ryanmrichard/.github/.github/workflows/check_formatting.yaml@master

  # Dry-run of the actual sdist/wheel build (not just an editable install via
  # test_python below) -- catches e.g. files missing from the sdist manifest
  # that an editable install wouldn't. Matches NWXCMake's own pull_request.yaml.
  test_pypi_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build PyPI Distribution
        uses: ryanmrichard/.github/.github/actions/build_pypi_dist@master
        with:
          extra_index_url: https://test.pypi.org/simple/

  test_nwx_docs:
    uses: ryanmrichard/.github/.github/workflows/test_nwx_docs.yaml@master
    with:
      doc_target: "Sphinx"

  # FriendZone is pure Python (no CMakeLists.txt), so there's nothing to
  # compile and the compiler axis of the shared dev matrix is meaningless
  # here -- just a lean OS-only matrix. setup_nwx_dev_env still runs (via its
  # unconditional MPI/Boost install) because nwchemex-simde's prebuilt wheel
  # dynamically links against libmpi at import time, and bare GitHub runners
  # have no MPI by default.
  test_python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to 3.12, not "3.x" (whatever's newest, e.g. 3.14 today):
      # nwchemex-simde and its own transitive deps are only published as
      # prebuilt wheels for cp312 (platform_matrix.yaml's release_matrix).
      # Under a newer ambient Python, pip falls back to building those from
      # source, which succeeds (setup_nwx_dev_env provides MPI/Boost/etc.)
      # but produces a binary missing the rpath-bundled shared libs that
      # cibuildwheel+delocate/auditwheel normally provide for the real
      # published wheel, so it fails to import at runtime.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup NWX Dev Environment
        uses: ryanmrichard/.github/.github/actions/setup_nwx_dev_env@master
        with:
          compiler: gcc-14
      - name: Install
        shell: bash
        run: |
          pip install -e ".[dev]" --extra-index-url https://test.pypi.org/simple/
      # TEMPORARY diagnostic step: isolate whether the crash happens at
      # RuntimeView() construction itself (outside pytest's output
      # capturing/buffering, so any native crash message is unambiguous)
      # before falling back to guessing from pytest's own captured output.
      - name: Debug RuntimeView Construction
        shell: bash
        run: |
          echo "-- fetching OpenMPI 4.1.6 help text only, to unmask the real error --"
          # The wheel's bundled libmpi looks for its runtime data/help text at
          # a hardcoded /usr/local/openmpi/... path that doesn't exist here,
          # so MPI_Init's *actual* failure reason gets swallowed by a
          # secondary "couldn't open the help file" message. OPAL_PREFIX lets
          # us point it at a real (if minimal) share/openmpi/ directory so
          # the real underlying message prints instead.
          curl -fsSL https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.6.tar.gz -o /tmp/openmpi.tar.gz
          mkdir -p /tmp/openmpi-src
          tar -xzf /tmp/openmpi.tar.gz -C /tmp/openmpi-src --strip-components=1
          mkdir -p /tmp/opal-prefix/share/openmpi
          find /tmp/openmpi-src -iname "help-*" -type f -exec cp {} /tmp/opal-prefix/share/openmpi/ \;
          ls /tmp/opal-prefix/share/openmpi/ | head -20
          export OPAL_PREFIX=/tmp/opal-prefix

          echo "-- installed nwchemex packages --"
          pip list | grep -i nwchemex

          echo "-- site-packages .libs dirs --"
          SITE_DIR=$(python -c "import site; print(site.getsitepackages()[0])")
          for d in "$SITE_DIR"/*.libs; do
            echo "== $d =="
            ls -la "$d" || true
          done

          echo "-- ldd of parallelzone extension --"
          PZ_EXT=$(python -c "import parallelzone, os; print(os.path.dirname(parallelzone.__file__))")
          find "$PZ_EXT" -name "*.so*" -exec ldd {} \;

          echo "-- bundled libmpi: hash, symbol count, size --"
          LIBMPI=$(find "$SITE_DIR" -path "*.libs/libmpi*" | head -1)
          echo "libmpi path: $LIBMPI"
          ls -la "$LIBMPI"
          nm -D "$LIBMPI" | grep -ci shmem || true

          echo "-- importing parallelzone --"
          python -u -c "import parallelzone; print('import OK')"

          echo "-- constructing RuntimeView (with OPAL_PREFIX set, verbose shmem/opal) --"
          OMPI_MCA_shmem_base_verbose=100 \
          OMPI_MCA_opal_base_verbose=100 \
          OMPI_MCA_opal_base_help_aggregate=0 \
          python -u -c "import parallelzone as pz; rv = pz.runtime.RuntimeView(); print('RuntimeView OK')" || true

          echo "-- forcing shmem=posix --"
          OMPI_MCA_shmem=posix python -u -c "import parallelzone as pz; rv = pz.runtime.RuntimeView(); print('RuntimeView OK (posix)')" || true

          echo "-- forcing shmem=mmap --"
          OMPI_MCA_shmem=mmap python -u -c "import parallelzone as pz; rv = pz.runtime.RuntimeView(); print('RuntimeView OK (mmap)')" || true

          echo "-- forcing shmem=sysv --"
          OMPI_MCA_shmem=sysv python -u -c "import parallelzone as pz; rv = pz.runtime.RuntimeView(); print('RuntimeView OK (sysv)')" || true

          echo "-- final: real (non-forced) attempt, must succeed for step to pass --"
          python -u -c "import parallelzone as pz; rv = pz.runtime.RuntimeView(); print('RuntimeView OK')"

      - name: Test Python
        shell: bash
        run: |
          set +e
          pytest -v
          pytest_exit=$?
          set -e

          if [ "$pytest_exit" -eq 5 ]; then
              echo "::error::zero pytest tests were found."
              exit 1
          fi
          exit "$pytest_exit"
